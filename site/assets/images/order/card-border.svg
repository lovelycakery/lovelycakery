      <ellipse cy="-9" rx="3.8" ry="6" fill="#f5b0c8" opacity="0.88"/>
      <ellipse cy="-9" rx="3.8" ry="6" fill="#f5b0c8" opacity="0.88" transform="rotate(72)"/>
      <ellipse cy="-9" rx="3.8" ry="6" fill="#f5b0c8" opacity="0.88" transform="rotate(144)"/>
      <ellipse cy="-9" rx="3.8" ry="6" fill="#f5b0c8" opacity="0.88" transform="rotate(216)"/>
      <ellipse cy="-9" rx="3.8" ry="6" fill="#f5b0c8" opacity="0.88" transform="rotate(288)"/>
      <circle r="3.5" fill="#fde3a0" opacity="0.95"/>
    </g>
    <g id="sf">
      <ellipse cy="-6.5" rx="2.8" ry="4.5" fill="#f5b0c8" opacity="0.80"/>
      <ellipse cy="-6.5" rx="2.8" ry="4.5" fill="#f5b0c8" opacity="0.80" transform="rotate(72)"/>
      <ellipse cy="-6.5" rx="2.8" ry="4.5" fill="#f5b0c8" opacity="0.80" transform="rotate(144)"/>
      <ellipse cy="-6.5" rx="2.8" ry="4.5" fill="#f5b0c8" opacity="0.80" transform="rotate(216)"/>
      <ellipse cy="-6.5" rx="2.8" ry="4.5" fill="#f5b0c8" opacity="0.80" transform="rotate(288)"/>
      <circle r="2.4" fill="#fde3a0" opacity="0.92"/>
    </g>
  </defs>

  <!-- =====
    藤蔓：對稱拱形貝茲曲線，G1 全程連續
    上下邊 3 個完整波（6 段拱形，每段 96px），左右邊各 2 個完整波
    每段拱形兩個控制點均在波峰側，確保過零點切線陡峭（自然蜿蜒感）
    角落段以切線連續方式銜接
  ===== -->
  <path d="
    M 72,18
    C  96,18  140,10  168,18
    C 196,26  236,26  264,18
    C 292,10  332,10  360,18
    C 388,26  428,26  456,18
    C 484,10  524,10  552,18
    C 580,26  624,18  648,18
    C 672,18  706,44  707,72
    C 708,100 718,140 707,176
    C 696,212 696,244 707,280
    C 718,316 718,348 707,384
    C 696,420 708,462 707,488
    C 706,514 672,542 648,542
    C 624,542 580,550 552,542
    C 524,534 484,534 456,542
    C 428,550 388,550 360,542
    C 332,534 292,534 264,542
    C 236,550 196,550 168,542
    C 140,534  96,542  72,542
    C  48,542  14,514  13,488
    C  12,462   2,420  13,384
    C  24,348  24,316  13,280
    C   2,244   2,212  13,176
    C  24,140  12,100  13,72
    C  14,44   48,18   72,18
    Z"
    fill="none" stroke="#87c094" stroke-width="1.3" opacity="0.60"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== 葉子（角落） ===== -->
  <ellipse cx="60"  cy="48"  rx="3"   ry="7"   fill="#87c094" opacity="0.78" transform="rotate(-38,60,48)"/>
  <ellipse cx="22"  cy="76"  rx="3"   ry="7"   fill="#87c094" opacity="0.72" transform="rotate(24,22,76)"/>
  <ellipse cx="44"  cy="21"  rx="2.5" ry="6"   fill="#87c094" opacity="0.65" transform="rotate(-62,44,21)"/>
  <ellipse cx="660" cy="48"  rx="3"   ry="7"   fill="#87c094" opacity="0.78" transform="rotate(38,660,48)"/>
  <ellipse cx="698" cy="76"  rx="3"   ry="7"   fill="#87c094" opacity="0.72" transform="rotate(-24,698,76)"/>
  <ellipse cx="676" cy="21"  rx="2.5" ry="6"   fill="#87c094" opacity="0.65" transform="rotate(62,676,21)"/>
  <ellipse cx="60"  cy="512" rx="3"   ry="7"   fill="#87c094" opacity="0.78" transform="rotate(38,60,512)"/>
  <ellipse cx="22"  cy="484" rx="3"   ry="7"   fill="#87c094" opacity="0.72" transform="rotate(-24,22,484)"/>
  <ellipse cx="44"  cy="539" rx="2.5" ry="6"   fill="#87c094" opacity="0.65" transform="rotate(62,44,539)"/>
  <ellipse cx="660" cy="512" rx="3"   ry="7"   fill="#87c094" opacity="0.78" transform="rotate(-38,660,512)"/>
  <ellipse cx="698" cy="484" rx="3"   ry="7"   fill="#87c094" opacity="0.72" transform="rotate(24,698,484)"/>
  <ellipse cx="676" cy="539" rx="2.5" ry="6"   fill="#87c094" opacity="0.65" transform="rotate(-62,676,539)"/>

  <!-- 上邊葉（內峰旁，位置不等距） -->
  <ellipse cx="214" cy="27"  rx="2.5" ry="5.5" fill="#87c094" opacity="0.70" transform="rotate(-5,214,27)"/>
  <ellipse cx="414" cy="29"  rx="2.5" ry="5.5" fill="#87c094" opacity="0.65" transform="rotate(9,414,29)"/>

  <!-- 下邊葉（位置與上邊錯開） -->
  <ellipse cx="308" cy="533" rx="2.5" ry="5.5" fill="#87c094" opacity="0.70" transform="rotate(6,308,533)"/>
  <ellipse cx="506" cy="530" rx="2.5" ry="5.5" fill="#87c094" opacity="0.65" transform="rotate(-8,506,530)"/>

  <!-- 左邊葉（外峰側） -->
  <ellipse cx="28"  cy="232" rx="2.5" ry="5.5" fill="#87c094" opacity="0.70" transform="rotate(-85,28,232)"/>
  <ellipse cx="30"  cy="438" rx="2.5" ry="5.5" fill="#87c094" opacity="0.65" transform="rotate(85,30,438)"/>

  <!-- 右邊葉（外峰側） -->
  <ellipse cx="692" cy="120" rx="2.5" ry="5.5" fill="#87c094" opacity="0.70" transform="rotate(85,692,120)"/>
  <ellipse cx="690" cy="334" rx="2.5" ry="5.5" fill="#87c094" opacity="0.65" transform="rotate(-85,690,334)"/>

  <!-- ===== 花朵 ===== -->

  <!-- 角落大花 -->
  <use href="#lf" transform="translate(34,32)"/>
  <use href="#lf" transform="translate(56,17)"/>
  <use href="#sf" transform="translate(17,56)"/>
  <use href="#lf" transform="translate(686,32)"/>
  <use href="#lf" transform="translate(664,17)"/>
  <use href="#sf" transform="translate(703,56)"/>
  <use href="#lf" transform="translate(34,528)"/>
  <use href="#lf" transform="translate(56,543)"/>
  <use href="#sf" transform="translate(17,504)"/>
  <use href="#lf" transform="translate(686,528)"/>
  <use href="#lf" transform="translate(664,543)"/>
  <use href="#sf" transform="translate(703,504)"/>

  <!-- 上邊小花（內峰，2 朵） -->
  <use href="#sf" transform="translate(216,24)"/>
  <use href="#sf" transform="translate(408,24)"/>

  <!-- 下邊小花（內峰，與上邊位置錯開） -->
  <use href="#sf" transform="translate(312,536)"/>
  <use href="#sf" transform="translate(504,536)"/>

  <!-- 左邊小花（內峰） -->
  <use href="#sf" transform="translate(21,124)"/>
  <use href="#sf" transform="translate(21,332)"/>

  <!-- 右邊小花（內峰） -->
  <use href="#sf" transform="translate(699,228)"/>
  <use href="#sf" transform="translate(699,436)"/>

  <!-- 花苞小圓點（外峰，僅深弧位置） -->
  <circle cx="312" cy="12"  r="2.5" fill="#f5b0c8" opacity="0.72"/>
  <circle cx="504" cy="12"  r="2.5" fill="#f5b0c8" opacity="0.72"/>
  <circle cx="216" cy="548" r="2.5" fill="#f5b0c8" opacity="0.72"/>
  <circle cx="408" cy="548" r="2.5" fill="#f5b0c8" opacity="0.72"/>
  <circle cx="5"   cy="228" r="2.5" fill="#f5b0c8" opacity="0.68"/>
  <circle cx="6"   cy="440" r="2.5" fill="#f5b0c8" opacity="0.68"/>
  <circle cx="715" cy="124" r="2.5" fill="#f5b0c8" opacity="0.68"/>
  <circle cx="715" cy="332" r="2.5" fill="#f5b0c8" opacity="0.68"/>
</svg>
