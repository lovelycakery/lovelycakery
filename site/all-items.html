<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lovely Cakery 全部品項 — 探索我們完整的手工千層蛋糕系列。Explore our complete collection of handmade mille crepe cakes.">
    <meta property="og:title" content="全部品項 - Lovely Cakery">
    <meta property="og:description" content="探索我們完整的手工千層蛋糕系列，每一款都用心製作。">
    <meta property="og:image" content="https://lovelycakery.github.io/lovelycakery/assets/images/products/%E7%84%A6%E7%B5%96%E5%8D%83%E5%B1%A4.jpg">
    <meta property="og:url" content="https://lovelycakery.github.io/lovelycakery/all-items.html">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#ffffff">
    <title data-en="All Items - Lovely Cakery" data-zh="全部品項 - Lovely Cakery">全部品項 - Lovely Cakery</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preload" href="assets/data/products-data.json" as="fetch" crossorigin>
    <link rel="preload" href="assets/data/seasonal-data.json" as="fetch" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/css/styles.css?v=20261125-1">
    <!-- Google Fonts loaded by site-header.js -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-10994472042"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-10994472042');
    </script>
</head>
<body class="all-items-page">
    <header class="header" id="site-header"></header>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title" data-en="All Items" data-zh="全部品項">全部品項</h1>
                <p class="page-subtitle" data-en="Layer by layer, made with love." data-zh="層層手作，每一層，都是用心。">層層手作，每一層，都是用心。</p>
            </div>

            <!-- 分類分頁列（新品上市／季節品項／自訂分頁…）：
                 由 gallery-loader.js 依 products-data.json 的 categories 動態產生，admin 可增減、排序、隱藏 -->
            <nav class="order-tags admin-only" id="categoryTabs" aria-label="商品分類"></nav>

            <!-- 各分類的區塊（訪客頁與 admin 預覽模式）；同樣由 gallery-loader.js 產生 -->
            <div id="categorySections" class="admin-only"></div>

            <!-- admin 編輯模式專用：不分類的單一相簿，順序＝products-data.json 的 items（拖曳排序與點擊編輯靠這個索引） -->
            <div class="gallery-grid edit-only" data-gallery-type="products">
                <!-- Images loaded dynamically by gallery-loader.js -->
            </div>
        </div>
    </main>
    <noscript><p style="text-align:center;padding:40px;font-size:16px;color:#3d2817;">本網站需要 JavaScript 才能正常顯示。請啟用 JavaScript 後重新整理頁面。<br>This website requires JavaScript. Please enable it and reload.</p></noscript>

    <!-- admin 編輯模式：移除分類列與分類區塊（.admin-only），只留不分類的單一相簿（.edit-only） -->
    <!-- 公開頁與 admin 預覽模式：反過來，移除 .edit-only，顯示依分類分區的完整版 -->
    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('adminPreview') === '1' && params.get('mode') === 'edit') {
            document.querySelectorAll('.admin-only').forEach(function (el) { el.remove(); });
        } else {
            document.body.classList.add('is-test-mode');
            document.querySelectorAll('.edit-only').forEach(function (el) { el.remove(); });
        }
    })();
    </script>

    <script defer src="assets/js/site-header.js?v=20261125-2"></script>
    <script defer src="assets/js/i18n.js"></script>
    <script defer src="assets/js/gallery-loader.js?v=20261125-4"></script>
    <script defer src="assets/js/image-protection.js"></script>

    <!-- 計算 fixed 分頁列高度，提供給 .all-items-section 的 scroll-margin-top 使用 -->
    <script>
    (function () {
        function updateTagsHeight() {
            var tags = document.querySelector('.order-tags');
            if (!tags) return;
            document.documentElement.style.setProperty('--tags-h', tags.getBoundingClientRect().height + 'px');
        }
        document.addEventListener('DOMContentLoaded', updateTagsHeight);
        if (document.fonts) document.fonts.ready.then(updateTagsHeight);
        window.addEventListener('resize', updateTagsHeight);
    })();
    </script>
</body>
</html>
