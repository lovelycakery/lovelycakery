<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Lovely Admin</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

    <!-- Login screen (shown when no token) -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h1>Lovely Admin</h1>
            <p>請輸入你的 GitHub Personal Access Token<br>（需要 repo 權限）</p>
            <div class="login-error" id="loginError"></div>
            <input type="password" id="tokenInput" class="input" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
            <button id="loginBtn" class="btn btn-primary" type="button">登入</button>
            <div class="login-help">
                如何取得 Token：<a href="https://github.com/settings/tokens/new?scopes=repo&description=Lovely+Admin" target="_blank" rel="noopener">GitHub Settings &rarr; Tokens</a><br>
                勾選 <strong>repo</strong> 權限即可。
            </div>
        </div>
    </div>

    <!-- Main app (shown after login) -->
    <div class="app" id="appContainer" style="display: none;">
        <header class="topbar">
            <div class="topbar__left">
                <div class="brand">Lovely Admin</div>
                <div class="mode-switcher">
                    <button id="editModeBtn" class="mode-btn active" type="button">編輯模式</button>
                    <button id="previewModeBtn" class="mode-btn" type="button">預覽模式</button>
                </div>
            </div>
            <div class="topbar__center" id="topbarCenter">
                <div class="topbar__tabs">
                    <button class="tab-btn" data-tab="calendar" data-page="calendar.html">日曆</button>
                    <button class="tab-btn" data-tab="seasonal" data-page="seasonal.html">季節限定</button>
                    <button class="tab-btn" data-tab="products" data-page="all-items.html">全部品項</button>
                </div>
            </div>
            <div class="topbar__right">
                <button id="publishBtn" class="btn btn-sm btn-primary" type="button" disabled>一鍵發布</button>
                <span class="topbar__user" id="userInfo"></span>
                <button id="claudeKeyBtn" class="btn btn-sm btn-secondary" type="button" title="設定 Claude API Key">AI</button>
                <button id="logoutBtn" class="btn btn-sm btn-secondary" type="button">登出</button>
            </div>
        </header>

        <main class="main" id="mainContainer">
            <section class="preview">
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
                <div id="deployHint" class="deploy-hint" style="display: none;"></div>
                <iframe id="previewFrame" class="preview__frame" title="Preview"></iframe>
            </section>

            <aside class="panel" id="editPanel">
                <!-- Calendar panel -->
                <div id="calendarPanel" class="panel-content">
                    <div class="panel__section">
                        <div class="panel__title" id="selectedDate">選取日期：尚未選取</div>
                    </div>

                    <div id="calendarEditForm" style="display: none;">
                        <div class="panel__section">
                            <label class="label">項目（每日最多 <span id="maxItemsLabel">3</span> 項）</label>
                            <div id="calendarItemsContainer"></div>
                            <button id="addItemBtn" class="btn btn-sm" type="button" style="margin-top:6px;">＋ 新增項目</button>
                            <button id="translateAllCalendarBtn" class="btn btn-sm btn-translate" type="button" style="margin-top:6px;margin-left:6px;" title="用 Claude AI 翻譯所有未翻譯的項目">AI 翻譯整月</button>
                        </div>

                        <div class="panel__section panel__actions">
                            <button id="saveBtn" class="btn btn-primary" type="button" disabled>儲存</button>
                            <button id="clearBtn" class="btn btn-danger" type="button" disabled>清除</button>
                        </div>
                    </div>
                </div>

                <!-- Image management panel -->
                <div id="imagePanel" class="panel-content" style="display: none;">
                    <div class="panel__section">
                        <div class="panel__title" id="selectedImage">選取圖片：尚未選取</div>
                    </div>

                    <div id="imageEditForm" style="display: none;">
                        <div class="panel__section">
                            <label class="label" for="imageNameInput">名稱</label>
                            <input type="text" id="imageNameInput" class="input" placeholder="例如：草莓千層">
                        </div>

                        <div class="panel__section">
                            <div class="label-row">
                                <label class="label" for="imageNameEnInput">名稱 (英文)</label>
                                <button id="translateBtn" class="btn btn-translate" type="button" title="用 Claude AI 自動翻譯">AI 翻譯</button>
                            </div>
                            <input type="text" id="imageNameEnInput" class="input" placeholder="例如：Strawberry Mille Crepe">
                        </div>

                        <div class="panel__section">
                            <label class="label">價格</label>
                            <div class="price-inputs">
                                <div class="price-input-group">
                                    <label class="price-label" for="imagePriceSize6Input">6吋</label>
                                    <input type="text" id="imagePriceSize6Input" class="input price-input" placeholder="例如：1800">
                                </div>
                                <div class="price-input-group">
                                    <label class="price-label" for="imagePriceSize8Input">8吋</label>
                                    <input type="text" id="imagePriceSize8Input" class="input price-input" placeholder="例如：2000">
                                </div>
                                <div class="price-input-group">
                                    <label class="price-label" for="imagePriceSliceInput">切片</label>
                                    <input type="text" id="imagePriceSliceInput" class="input price-input" placeholder="例如：180">
                                </div>
                            </div>
                        </div>

                        <div class="panel__section">
                            <label class="label" for="imageDescInput">描述</label>
                            <textarea id="imageDescInput" class="input textarea" rows="3" placeholder="可留空"></textarea>
                        </div>

                        <div class="panel__section">
                            <label class="label" for="imageDescEnInput">描述 (英文)</label>
                            <textarea id="imageDescEnInput" class="input textarea" rows="3" placeholder="Optional"></textarea>
                        </div>

                        <div class="panel__section">
                            <label class="label">標籤</label>
                            <div class="tag-checkboxes">
                                <label><input type="checkbox" value="奶蛋素" id="tag-vegetarian"> 奶蛋素</label>
                                <label><input type="checkbox" value="無咖啡因" id="tag-caffeine-free"> 無咖啡因</label>
                                <label><input type="checkbox" value="含酒精" id="tag-alcohol"> 含酒精</label>
                                <label><input type="checkbox" value="可宅配" id="tag-delivery"> 可宅配</label>
                            </div>
                        </div>

                        <div class="panel__section panel__actions">
                            <button id="imageEditSaveBtn" class="btn btn-primary" type="button" disabled>儲存</button>
                            <button id="imageEditDeleteBtn" class="btn btn-danger" type="button" disabled>刪除</button>
                        </div>
                    </div>

                    <div class="panel__section">
                        <div class="panel__title">上傳圖片</div>
                        <div class="image-upload-area" id="imageUploadArea">
                            <p>拖曳圖片到此處或點擊選擇</p>
                            <input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/webp" multiple style="display: none;">
                        </div>
                    </div>

                    <div class="panel__section">
                        <button id="checkEnglishBtn" class="btn btn-secondary" type="button">檢查所有欄位</button>
                        <button id="downloadBackupBtn" class="btn btn-secondary" type="button" style="margin-top: 8px;">下載備份</button>
                        <button id="batchDeleteBtn" class="btn btn-secondary" type="button" style="margin-top: 8px;">選取</button>
                        <div id="batchDeleteActions" style="display: none; margin-top: 8px;">
                            <button id="batchDeleteConfirmBtn" class="btn btn-danger" type="button" disabled>刪除已選 (0)</button>
                            <button id="batchDeleteCancelBtn" class="btn btn-secondary" type="button" style="margin-top: 8px;">取消</button>
                        </div>
                    </div>
                </div>

                <!-- Status box (shared across tabs) -->
                <div class="panel__section">
                    <div class="panel__title status-toggle" id="statusToggle">
                        狀態 <span class="status-toggle-icon">&#9660;</span>
                    </div>
                    <pre id="statusBox" class="status-box"></pre>
                </div>
            </aside>
        </main>
    </div>

    <!-- Check result modal -->
    <div id="checkResultModal" class="check-result-modal" style="display: none;">
        <div class="check-result-modal__overlay"></div>
        <div class="check-result-modal__content">
            <div class="check-result-modal__header">
                <h3 class="check-result-modal__title" id="checkResultModalTitle"></h3>
                <button class="check-result-modal__close" id="checkResultModalClose" aria-label="關閉">&times;</button>
            </div>
            <div class="check-result-modal__body" id="checkResultModalBody"></div>
            <div class="check-result-modal__footer">
                <button class="btn btn-primary" id="checkResultModalOk">確定</button>
            </div>
        </div>
    </div>

    <script src="assets/js/jszip.min.js"></script>
    <script src="assets/js/admin-github-api.js"></script>
    <script src="assets/js/admin-image-compress.js"></script>
    <script src="assets/js/admin-translate.js"></script>
    <script src="assets/js/admin-app.js"></script>
</body>
</html>
