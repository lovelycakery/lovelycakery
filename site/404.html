<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lovely Cakery</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f5f3f0;
            color: #3d2817;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .error-card {
            background: #fff;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(61, 40, 23, 0.1);
        }
        h1 { font-size: 72px; font-weight: 700; color: #c8a24a; margin-bottom: 16px; }
        p { font-size: 18px; line-height: 1.6; margin-bottom: 24px; color: #6b5d4f; }
        a {
            display: inline-block;
            padding: 14px 32px;
            background: #e8d5c4;
            color: #3d2817;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 500;
            transition: background 0.3s;
        }
        a:hover { background: #d4c0a8; }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-10994472042"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-10994472042');
    </script>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <p>找不到這個頁面<br>Page not found</p>
        <a href="index.html">回到首頁 / Back to Home</a>
    </div>
</body>
</html>
