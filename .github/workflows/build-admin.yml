name: Build Admin Tool

on:
  workflow_dispatch:  # 只支持手动触发，不会自动构建

permissions:
  contents: write  # 需要写入权限来创建 Release

jobs:
  build-windows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      
      - name: Install Wine (for Windows builds on Linux)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32
      
      - name: Install dependencies
        working-directory: ./admin
        run: npm ci
      
      - name: Build Windows portable
        working-directory: ./admin
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:win:portable
      
      - name: Get version from package.json
        id: version
        working-directory: ./admin
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: admin-v${{ steps.version.outputs.version }}
          name: Admin Tool v${{ steps.version.outputs.version }}
          body: |
            ## Admin Tool 更新
            
            版本：v${{ steps.version.outputs.version }}
            
            ### 下载
            下载 `Lovely Admin-*.exe` 文件，确保与 `site/` 文件夹在同一目录层级。
          files: admin/dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

