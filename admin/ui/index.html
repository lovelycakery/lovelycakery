<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Lovely Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar__left">
          <div class="brand">Lovely Admin</div>
          <div id="siteInfo" class="site-info"></div>
        </div>
        <div class="topbar__right">
          <button id="preflightBtn" class="btn btn-secondary" type="button">本機檢查</button>
          <button id="publishBtn" class="btn btn-primary" type="button">一鍵發布</button>
        </div>
      </header>

      <main class="main">
        <section class="preview">
          <div class="preview__hint">
            預覽（訪客頁）：點日曆日期可編輯，儲存後會以訪客畫面顯示結果。
          </div>
          <iframe id="previewFrame" class="preview__frame" title="Preview"></iframe>
        </section>

        <aside class="panel">
          <div class="panel__section">
            <div class="panel__title">選取日期</div>
            <div id="selectedDate" class="selected-date">尚未選取</div>
          </div>

          <div class="panel__section">
            <label class="label" for="statusSelect">狀態</label>
            <select id="statusSelect" class="input">
              <option value="available">可預訂</option>
              <option value="unavailable">不可預訂</option>
              <option value="closed">休息</option>
            </select>
          </div>

          <div class="panel__section">
            <label class="label" for="descInput">說明（點日曆時顯示）</label>
            <textarea id="descInput" class="input textarea" rows="7" placeholder="可留空"></textarea>
          </div>

          <div class="panel__section panel__actions">
            <button id="saveBtn" class="btn btn-primary" type="button" disabled>儲存</button>
            <button id="clearBtn" class="btn btn-danger" type="button" disabled>清除</button>
          </div>

          <div class="panel__section">
            <div class="panel__title">狀態</div>
            <pre id="statusBox" class="status-box"></pre>
          </div>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
